[package]
name = "air"
version = "4.0.1"
edition = "2024"
authors = ["Caleb Couch <caleb@orange.me>"]
description = "A.I.R"
license = "BSD-3-Clause"
repository = "https://github.com/ramp-stack/air.git"
readme = "README.md"
include = ["/src/**/*.rs", "/Cargo.toml", "/Cargo.lock", "/README.md"]

[features]
# cfg(test) is not set when air is a dependency. air_server tests enable this
# so orange.me resolves to 127.0.0.1, the same host air's own tests use.
local = []

[dependencies]
hex = "0.4.3"
serde = {version = "1.0.202", features=["rc", "derive"]}
serde_with = "3.14.0"

chacha20-poly1305 = "0.1.2"
secp256k1 = { version = "0.31.1", features = ["serde", "global-context", "rand", "hashes", "alloc"] }
chrono = "0.4.44"
postcard = {version = "1.1.3", features = ["alloc"]}

[dev-dependencies]
tokio = {version = "1.47.1", features = ["macros", "rt"]}
